[project]
name = "plate-detector"
version = "0.1.0"
description = "Offline, CPU-only licence plate recognition from dashcam video"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "models", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast tests with no models or video",
    "integration: needs model files and/or the sample videos",
]
